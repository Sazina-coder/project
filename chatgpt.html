<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Myntra Style Slider</title>
  <style>
    /* This resets the page */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    /* Make the font look nice */
    body { font-family: Arial, sans-serif; }

    /* The big box that holds all slides */
    .slider {
      position: relative;
      width: 100%;
      height: 80vh;        /* height of the slider */
      overflow: hidden;    /* hides the parts that go outside */
    }

    /* The long strip of all slides (like a train) */
    .slides {
      display: flex;                     /* puts slides in one row */
      transition: transform 0.8s ease;   /* smooth sliding effect */
      width: 300%;                       /* 3 slides → 3 × 100% */
    }

    /* Each single slide */
    .slide {
      width: 100%;       /* take full width of the screen */
      flex-shrink: 0;    /* stop slides from shrinking */
      position: relative;
    }

    /* Images inside slides */
    .slide img {
      width: 100%;
      height: 80vh;
      object-fit: cover; /* fill without stretching weirdly */
    }

    /* Text on top of the image */
    .caption {
      position: absolute;
      bottom: 40px;
      left: 50px;
      background: rgba(255,255,255,0.7);
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 1.2rem;
      font-weight: bold;
    }

    /* The dots below the slides */
    .dots {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
    }

    /* Each dot */
    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #bbb;
      cursor: pointer;
      transition: background 0.3s;
    }

    /* The dot that shows the active slide */
    .dot.active {
      background: #333;
    }
  </style>
</head>
<body>

  <!-- The whole slider -->
  <div class="slider">
    <!-- All slides inside one box -->
    <div class="slides" id="slides">
      <!-- Slide 1 -->
      <div class="slide">
        <img src="https://images.unsplash.com/photo-1520975918318-3cbe600c2c04" alt="model1">
        <div class="caption">New Collection 2025</div>
      </div>
      <!-- Slide 2 -->
      <div class="slide">
        <img src="https://images.unsplash.com/photo-1503341455253-b2e723bb3dbb" alt="model2">
        <div class="caption">Sale Up to 60% Off</div>
      </div>
      <!-- Slide 3 -->
      <div class="slide">
        <img src="https://images.unsplash.com/photo-1512436991641-6745cdb1723f" alt="model3">
        <div class="caption">Unisex Streetwear</div>
      </div>
    </div>

    <!-- Dots for clicking -->
    <div class="dots">
      <span class="dot active" onclick="moveSlide(0)"></span>
      <span class="dot" onclick="moveSlide(1)"></span>
      <span class="dot" onclick="moveSlide(2)"></span>
    </div>
  </div>

  <!-- The code that moves slides -->
  <script>
    const slides = document.getElementById("slides");
    const dots = document.querySelectorAll(".dot");

    function moveSlide(index) {
      // Move the slides left by 0%, 100%, or 200%
      slides.style.transform = `translateX(-${index * 100}%)`;

      // Change the active dot color
      dots.forEach(dot => dot.classList.remove("active"));
      dots[index].classList.add("active");
    }
  </script>

</body>
</html>
